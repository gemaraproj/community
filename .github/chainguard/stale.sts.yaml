# Octo-STS trust policy for the stale workflow.
# Exchanges the workflow's OIDC identity for a short-lived GitHub App token
# that can convert stale pull requests to draft, which GITHUB_TOKEN cannot.
# This repo uses GitHub's immutable OIDC subject, so the subject carries the
# owner and repository IDs.
issuer: https://token.actions.githubusercontent.com
subject: repo:gemaraproj@253605924/community@1310018163:ref:refs/heads/main
claim_pattern:
  job_workflow_ref: gemaraproj/community/\.github/workflows/stale\.yaml@refs/heads/main
permissions:
  pull_requests: write
